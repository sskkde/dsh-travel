<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><title>五一畅游西湖 | 手划（摇橹）船乘坐秘籍来了～ - 小红书</title><meta property="og:title" content="五一畅游西湖 | 手划（摇橹）船乘坐秘籍来了～"/></head><body><div id="app"><script>window.__INITIAL_STATE__ = {"user":{"loggedIn":false,"userFetchingStatus":undefined,"activeSubTab":undefined},"board":{"boardFeedsMap":{},"userBoardList":[]},"note":{"firstNoteId":"644b887b0000000013012f14","currentNoteId":"644b887b0000000013012f14","noteDetailMap":{"644b887b0000000013012f14":{"comments":{"list":[],"cursor":"","hasMore":true,"loading":false,"firstRequestFinish":false},"currentTime":1788364054056,"note":{"xsecToken":"","title":"五一畅游西湖 | 手划（摇橹）船乘坐秘籍来了～","imageList":[],"atUserList":[],"type":"normal","desc":"🛶荡荡悠悠，泛舟湖上\n\t\n✔️一边欣赏湖光山色，一边与船工闲话唠嗑，必定是最顶流的西湖游览方式之一～\n\t\n不知道去哪儿乘坐？船型如何挑选？如何消费得透明又规范？乘坐时遇到问题怎么办？\n\t\n这份秘籍收好，手把手教你乘船[得意R]\n\t\n✅到哪儿才能乘坐手划（摇橹）船？\n\t\n8个码头：湖滨二码头、湖滨五码头、断桥码头、中山码头、杭饭码头、马家湾码头、钱王祠码头、三潭印月北码头\n\t\n✔️有2个比较特殊——马家湾码头和杭饭码头：这两个码头既能乘坐手划船，又能乘坐摇橹船\n\t\n✅ 手划船和摇橹船该坐哪种？如何收费？\n\t\n一、外观不同\n手划船的布棚顶可以根据天气状况进行拆卸；摇橹船是固定式棚顶\n\t\n二、客容量不同\n手划船每船限乘6名游客（包含婴幼儿）\n摇橹船每船限乘10名游客（包含婴幼儿）\n\t\n三、价格不同\n手划船150元每小时\u002F船；\n摇橹船由于容量更大，收费是180元每小时\u002F船\n\t\n大家要注意的是两种船都是按乘船时长，而不以乘坐人数来计费，就是1个人乘船和6个人乘船是同样的价格\n\t\n📌注意①：两种船都是1小时起租，超过1小时后按每半小时计费，收费标准相应减半，不足半小时按半小时计收。节假日期间收费标准不变\n\t\n📌注意②：手划船、摇橹船都可以停靠小瀛洲，但上岛游览需要另外购买三潭印月门票（票价20块），并且游客上岛游览时，船只的等候时间计入乘船时间\n\t\n✅ 乘坐时，怎么维护自己的权益？\n\t\n在船上，可以看到每条手划（摇橹）船都有一个专属的二维码，vx扫一扫就可以进入“西湖手划（摇橹）船服务监督评价”系统\n\t\n📌乘船请务必扫描二维码，确认订单后就可以计时，确保消费透明规范，结束后还可以给船工的服务进行评价打分，也帮助管理部门对整个订单进行全过程的后台监管\n\t\n✅乘坐手划（摇橹）船，还需要注意什么？\n\t\n手划（摇橹）船经营时间是7:00-18:00\n\t\n✔️五一期间建议游客错峰乘坐，一般9:30之前相对客流量较小，13:30-17:00客流量最大，若遇客流高峰排队较长，建议选择其他水上游览船型\n\t\n#西湖[话题]# #西湖乘船[话题]# #杭州西湖乘船攻略[话题]# #西湖手划船[话题]# #杭州手划船[话题]#","user":{"userId":"63202010000000002303e84c","nickname":"无忧掌上西湖","avatar":"https:\u002F\u002Fsns-avatar-qc.xhscdn.com\u002Favatar\u002F63dccd8125455c47f72680f8.jpg","xsecToken":""},"interactInfo":{"liked":false,"collected":false,"collectedCount":"59","shareCount":"31","likedCount":"40","commentCount":"22","followed":false,"relation":"none","niceCount":""},"tagList":[{"id":"5bea7356e2d071000131df57","name":"西湖","type":"topic"},{"id":"62806704000000000100794e","name":"西湖乘船","type":"topic"},{"id":"63d9df7e000000000101c3dd","name":"杭州西湖乘船攻略","type":"topic"},{"id":"614b2383000000000101cce9","name":"西湖手划船","type":"topic"},{"id":"62a76414000000000101d940","name":"杭州手划船","type":"topic"}],"time":1682739009000,"lastUpdateTime":1682671800000,"shareInfo":{"unShare":false},"noteId":"644b887b0000000013012f14"},"seoRobots":"noindex,nofollow,nosnippet"}}},"serverRequestInfo":{"state":"success","errorCode":0}};</script></div></body></html>
