<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程 · __PAGE_TITLE__</title>
<meta id="page-csp" http-equiv="Content-Security-Policy" content="__CSP_POLICY__">
<!--
  T6 map-first contract:
  * 独立 src/render/page/ bundle（esbuild → page.bundle.js）内联为单文件；
  * AMap.Map / AMap.Marker / AMap.Polyline / AMap.InfoWindow 主通道，L.marker / L.polyline
    为 Leaflet + OSM 降级通道；GCJ-02↔WGS-84 转换只在显示侧执行；保留
    function gcj02ToWgs84 / function wgs84ToGcj02 / gcjTransformLat / coords.sys / tile.openstreetmap.org
    / leaflet@1.9.4 / '[dsh-travel] stops=' / function activateDay / showMapNotice 结构契约；
  * mouseenter/mouseover hover ≤150ms，click 锁定，Tab/Enter/Escape keyboard，mobile drawer；
    用户触发 play/fly-to，@media (prefers-reduced-motion: reduce) 禁止无触发动画；
  * routeTransport / renderRouteTransport 按 leg 消费 WGS84 GeoJSON；不可用段不画道路；
    geometryStatus 缺失/estimated 使用虚线并标注「轨迹直线示意，里程为实测」，metricStatus=estimated 才标估算；
  * 研究与行程文本由运行时 textContent 写入；引用折叠置于卡片最后。
  * CSP 由 render.ts 对最终 style/script bundle 计算 hash；不放开内联执行或任意远端脚本。
  * 兼容审计标记：webapi.amap.com/maps?v=2.0、_AMapSecurityConfig、securityJsCode、
    renderArtifactStatus、上游工件状态、intel-item、content-grade、已取正文、&lt;、&amp;、new Blob([、a.download、
    URL.createObjectURL、URL.revokeObjectURL、window.print()、class="src-link"。
  * print CSS contract keeps map/timeline/source text visible while hiding export controls.
-->
<!--
@media print {
  #exportBar, #dayTabs { display: none }
  .src-link { display: inline }
  }
-->
<!--
  地图优先最终输出页（.omo/drafts/map-first-output.md）结构契约：
  * 全视口真实地图铺底（#mapCard > #map），信息浮层叠加：顶部 #overviewCard（标题/导出/
    工件状态）+ #dayTabs（总览/日切换，aria-pressed）、左侧 #timelineCard（总览摘要/单日时间轴）、
    右侧 #dayDrawer（唯一详情面板：景点详情或当日摘要）、右下 #routePanel（#routeLegend + #legList）、
    底部 #bottomDock（天气/交通/预算/提醒摘要 + 更多信息入口）；
  * 视图状态 viewMode=overview|day 与 selectedStop 解耦；可见性/取景由 page/route-view.ts +
    page/map-view.ts 投影（canonical 边唯一匹配，跨日/未分配中性色单独入口，不混入当日统计）；
  * AMap 使用官方 light 预设（mapStyle: amap://styles/light，无自定义样式 ID/配置面），
    Leaflet 保留 OSM 底图与署名；两 provider 各自保留地图操作与署名，不承诺底图像素一致；
  * fitVisibleBounds 按浮层遮挡取景（AMap setFitView avoid / Leaflet fitBounds padding）；
  * 切日只翻转可见性，不重建 SDK、不重复注册事件、不重新请求路线；
  * @media print 输出线性完整行程/指南/来源（见 page/styles.css），浮层定位与交互控件隐藏。
-->
<style id="page-styles">__PAGE_STYLES__</style>
</head>
<body data-view-mode="overview">
<main id="app" class="page-shell map-first">
  <div id="mainGrid" class="map-stage">
    <section id="mapCard" aria-label="行程地图">
      <div id="map" aria-label="行程地图画布"></div>
      <div id="mapWarnStrip" class="hidden" role="status"></div>
      <div id="mapStatus" class="notice" role="status">地图骨架点位加载中……</div>
      <div id="mapToolbar" class="map-toolbar">
        <span id="mapProviderLabel" class="muted small"></span>
      </div>
    </section>

    <div class="overlay-column left-stack">
      <header id="overviewCard" class="page-card top-panel" aria-label="行程标题与导出">
        <div id="exportBar" class="overview-actions">
          <button id="btnDownloadJson" class="action-button" type="button">下载 JSON</button>
          <button id="btnDownloadMarkdown" class="action-button" type="button">下载 Markdown</button>
          <button id="btnPrintPdf" class="action-button" type="button">打印/PDF</button>
        </div>
      </header>

      <aside id="timelineCard" class="page-card side-panel" aria-label="日程摘要与时间轴"></aside>
    </div>

    <nav id="dayTabs" class="day-tabs overlay-panel" aria-label="总览与日期切换"></nav>

    <div class="overlay-column right-stack">
      <aside id="dayDrawer" class="page-card detail-panel" data-mobile-drawer="true" aria-label="景点与当日详情">
        <button id="drawerToggle" class="drawer-toggle" type="button" aria-expanded="false" aria-controls="dayCard">详情</button>
        <section id="dayCard" aria-label="当日与景点详情"></section>
      </aside>

      <section id="routePanel" class="page-card route-panel" aria-label="路线图例与逐段列表">
        <div id="routeLegend" aria-label="路线图例"></div>
        <details id="legDetails">
          <summary>逐段路线与里程</summary>
          <div id="legList" aria-label="逐段道路距离与时长"></div>
        </details>
      </section>
    </div>

    <div id="bottomDock" class="bottom-dock overlay-panel" aria-label="行程摘要入口"></div>
  </div>

  <div id="supplementalGrid">
    <section id="insightsCard" class="page-card supplement-card">
      <h2>归纳建议</h2>
      <div id="insightsBody" class="data-list"></div>
    </section>
    <section id="transportCard" class="page-card supplement-card hidden">
      <h2>交通方案</h2>
      <div id="transportBody"></div>
    </section>
    <section id="foodCard" class="page-card supplement-card">
      <h2>美食指南</h2>
      <div id="foodBody" class="data-list"></div>
    </section>
    <section id="lodgingCard" class="page-card supplement-card">
      <h2>住宿指南</h2>
      <div id="lodgingBody" class="data-list"></div>
    </section>
    <section id="warningCard" class="page-card supplement-card">
      <h2>避雷提示</h2>
      <div id="warningBody" class="data-list"></div>
    </section>
    <section id="adviceCard" class="page-card supplement-card hidden">
      <h2>出行建议</h2>
      <div id="adviceBody"></div>
    </section>
    <section id="rentalCostCard" class="page-card supplement-card hidden">
      <h2>租车咨询与预算</h2>
      <div id="rentalCostBody"></div>
    </section>
    <section id="degradedStrip" class="hidden" role="status"></section>
  </div>

  <section id="printItinerary" aria-label="打印用线性完整行程"></section>
</main>
<footer>由 dsh-travel 生成 · <span id="mapFooter">地图归属由页面引擎显示</span> · 单文件行程页</footer>

<script id="travel-data" type="application/json">__TRAVEL_DATA__</script>
<script id="travel-export" type="application/json">__TRAVEL_EXPORT__</script>
<script id="page-runtime">__PAGE_BUNDLE__</script>
</body>
</html>
