<header class="topbar"><div class="brand"><div class="brandmark">漫</div><span>漫游手记</span></div><div class="trip-head"><div class="eyebrow">布局 DEMO · 示例数据</div><h1>杭州，慢慢走</h1></div><div class="top-actions"><button class="pill share" id="saveBtn">♡　收藏行程</button><button class="pill" id="shareBtn">分享 ↗</button></div></header>
<nav class="date-switch" aria-label="选择行程日期"><button class="day-tab active" data-day="overview">总览</button><button class="day-tab" data-day="0">DAY 01 <small>湖畔初见</small></button><button class="day-tab" data-day="1">DAY 02 <small>山林寻茶</small></button><button class="day-tab" data-day="2">DAY 03 <small>城南旧事</small></button></nav>
<section class="panel itinerary"><div class="panel-kicker">YOUR DAY, AT A GLANCE</div><div class="panel-title"><h2 id="dayTitle">湖畔初见</h2><div class="weather-tag">☼　行前参考</div></div><div class="day-summary" id="daySummary">沿湖而行，把第一天留给 <b>西湖</b></div><div class="timeline" id="timeline"></div><div class="overview-days" id="overviewDays" hidden></div><div class="route-foot"><div class="route-metric"><strong id="routeStops">4 个停留点</strong><span></span><span id="routeDist">约 6.8 km（示例估算）</span></div><div>⌁　步行＋短途接驳</div></div></section>
<aside class="panel spot-card" id="spotCard"><div class="spot-top"><span class="spot-index" id="spotIndex">01　/　TODAY'S SPOT</span><button class="close" id="collapseBtn" aria-label="收起景点卡片">×</button></div><div class="spot-illustration"><i class="illu-sun"></i></div><h3 id="spotName">湖滨步行街</h3><p id="spotDesc">从湖边开启杭州慢生活。沿着湖岸散步，看城市与湖水在晨光里交汇。</p><div class="spot-meta"><span class="meta-chip" id="spotTime">建议停留 1.5 小时</span><span class="meta-chip">漫步 · 湖景</span></div><button class="spot-link" id="spotAction">看看这个地方　↗</button></aside><button class="card-collapsed" id="expandBtn">▣　景点详情</button>
<div class="map-controls"><button class="map-control" id="zoomIn" aria-label="放大地图">＋</button><div class="zoom-label" id="zoomLabel">100%</div><button class="map-control" id="zoomOut" aria-label="缩小地图">−</button><button class="map-control" id="resetMap" aria-label="复位地图">⌖</button><button class="map-control" id="layerToggle" aria-label="切换地图图层">◈</button></div><div class="legend" id="legend"><span><i></i>当日停留</span><span><i class="line-key"></i>行程连接示意</span></div>
<div class="bottom-dock"><div class="dock-item"><div class="dock-icon">☼</div><div class="dock-copy"><div class="dock-label">天气参考</div><div class="dock-value">春日出行 <em>· 请临行查询</em></div></div></div><div class="dock-item"><div class="dock-icon">↗</div><div class="dock-copy"><div class="dock-label">出行方式</div><div class="dock-value">步行＋公共交通</div></div></div><div class="dock-item"><div class="dock-icon">!</div><div class="dock-copy"><div class="dock-label">出发前提醒</div><div class="dock-value">景区开放信息请以现场为准</div></div></div><button class="dock-button" id="tipsBtn">行前提示　↗</button></div><div class="map-note">示意地图 · 路线仅表示行程连接，不作导航或实时路况依据</div><div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script>
(()=>{'use strict';
const days=[
 {title:'湖畔初见',summary:'沿湖而行，把第一天留给 <b>西湖</b>',dist:'约 6.8 km',stops:[['09:00','湖滨步行街','湖岸晨光 · 自由漫步','1.5 小时','从湖边开启杭州慢生活。沿着湖岸散步，看城市与湖水在晨光里交汇。'],['11:00','孤山·西泠印社','湖心访古 · 人文小游','1.5 小时','沿白堤向西，走进湖心的园林与金石篆刻故事。'],['14:00','花港观鱼','园林闲游 · 看鱼赏花','1.5 小时','在花木与水岸之间慢下来，留一点不赶时间的午后。'],['16:30','雷峰塔','登高望湖 · 日落前后','1 小时','登高望见湖山层叠。开放时间与门票请出发前核实。']]},
 {title:'山林寻茶',summary:'循着茶香走进 <b>龙井山坞</b>',dist:'约 8.2 km',stops:[['08:30','满觉陇','晨间山路 · 桂香村落','1 小时','沿山间小路感受村落清晨，步行路段请留意坡度。'],['10:30','中国茶叶博物馆','茶事入门 · 展馆参观','1.5 小时','了解茶文化与制作工艺，开放信息以场馆公告为准。'],['13:30','龙井村','茶山漫步 · 午间小憩','2 小时','在茶园与村落之间散步；此处不含茶园消费或实时报价。'],['16:00','九溪烟树','溪谷步道 · 林间慢行','2 小时','沿溪流走一段清凉步道，雨后留意路面湿滑。']]},
 {title:'城南旧事',summary:'从古街巷寻回 <b>杭州旧时光</b>',dist:'约 5.4 km',stops:[['09:00','河坊街','老街晨逛 · 小巷寻味','1.5 小时','从街巷与老建筑开始，体验杭州城南的日常气息。'],['11:00','胡雪岩故居','宅院探访 · 建筑细读','1 小时','参观前请查看当日开放安排，预留排队与步行时间。'],['14:00','南宋德寿宫遗址博物馆','遗址寻踪 · 文化展览','2 小时','预约与开放政策可能调整，请以官方公告为准。'],['16:30','吴山广场','城市收尾 · 随意散步','1 小时','用一段轻松散步收尾；晚间交通请提前规划。']]}
 ];let activeDay=0,activeStop=0,overview=true,zoom=1,layered=false;
 const $=id=>document.getElementById(id),timeline=$('timeline'),svg=$('mapSvg'),root=document.querySelector('.marker').parentNode,colors=['#397653','#b86b2e','#3869a8'];
 function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
 const layouts=[[[500,390],[620,350],[740,465],[850,590]],[[470,560],[570,390],[700,610],[820,470]],[[470,390],[580,460],[700,540],[820,610]]];
 function fitRoute(points){const mobile=matchMedia('(max-width:580px)').matches;svg.setAttribute('preserveAspectRatio','xMidYMid meet');if(!mobile){svg.setAttribute('viewBox','0 0 1440 900');return}const r=svg.getBoundingClientRect(),aspect=r.width/Math.max(1,r.height),xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);let x0=Math.min(...xs)-75,x1=Math.max(...xs)+75,y0=Math.min(...ys)-70,y1=Math.max(...ys)+70,w=x1-x0,h=y1-y0;if(w/h<aspect){let nw=h*aspect;x0-=(nw-w)/2;x1+=(nw-w)/2;w=nw}else{let nh=w/aspect;y0-=(nh-h)/2;y1+=(nh-h)/2;h=nh}svg.setAttribute('viewBox',`${x0} ${y0} ${w} ${h}`);svg.style.left='0';svg.style.width='100%'}
 function makeMap(){document.querySelectorAll('.route-path,.marker,.place-label').forEach(e=>e.remove());days.forEach((d,di)=>{let pts=layouts[di],path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M'+pts.map(p=>p.join(' ')).join(' L'));path.setAttribute('class',`route-line route-path route-day-${di}`);path.setAttribute('stroke-dasharray','9 7');path.setAttribute('fill','none');path.setAttribute('stroke-width','4');root.appendChild(path);d.stops.forEach((stop,si)=>{let [x,y]=pts[si];if(di===1&&si===1){x+=13;y-=10}if(di===2&&si===0){x-=13;y+=9}let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class',`marker marker-day-${di}`);g.dataset.day=di;g.dataset.stop=si;g.setAttribute('transform',`translate(${x} ${y})`);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',`DAY 0${di+1} ${stop[1]}`);g.innerHTML=`<circle class="outer" r="15" fill="white"/><circle r="11" fill="${colors[di]}"/><text class="place-num" y="1">D${di+1}·${si+1}</text>`;root.appendChild(g);let label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('class','place-label');label.setAttribute('x',x-25);label.setAttribute('y',y+32);label.textContent=stop[1];root.appendChild(label);g.onclick=()=>selectStop(di,si);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectStop(di,si)}}})})}
 function selectStop(day,i){activeDay=day;activeStop=i;let s=days[day].stops[i];document.querySelectorAll('.marker').forEach(m=>m.classList.toggle('active',+m.dataset.day===day&&+m.dataset.stop===i));document.querySelectorAll('.stop').forEach((el,n)=>{el.classList.toggle('selected',n===i);el.setAttribute('aria-pressed',String(n===i))});$('spotIndex').textContent=`DAY 0${day+1} · ${i+1} / TODAY'S SPOT`;$('spotName').textContent=s[1];$('spotDesc').textContent=s[4];$('spotTime').textContent=`建议停留 ${s[3]}`;$('spotCard').hidden=false;$('expandBtn').hidden=true}
 function renderDay(day){overview=false;activeDay=day;let d=days[day];document.querySelector('.itinerary').style.setProperty('--selected-day-color',colors[day]);document.querySelectorAll('.day-tab').forEach(b=>{let yes=b.dataset.day===String(day);b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});$('overviewDays').hidden=true;timeline.hidden=false;$('dayTitle').textContent=d.title;$('daySummary').innerHTML=d.summary;$('routeStops').textContent='4 个停留点';$('routeDist').textContent=`${d.dist}（示例估算）`;document.querySelectorAll('.route-path').forEach((e,i)=>e.style.display=i===day?'':'none');document.querySelectorAll('.marker').forEach(e=>e.style.display=+e.dataset.day===day?'':'none');document.querySelectorAll('.place-label').forEach((e,i)=>e.style.display=Math.floor(i/4)===day?'':'none');$('legend').classList.remove('overview');$('legend').innerHTML=`<span><i style="background:${colors[day]}"></i>DAY 0${day+1} 停留</span><span><i class="line-key" style="background:${colors[day]}"></i>行程连接示意</span>`;document.querySelector('.itinerary').classList.remove('overview-active');fitRoute(layouts[day]);timeline.innerHTML=d.stops.map((s,i)=>`<div class="stop ${i===0?'selected':''}" role="button" tabindex="0" aria-pressed="${i===0}" data-stop="${i}"><span class="dot"></span><div><div class="stop-name">${s[1]}</div><div class="stop-note">${s[2]}</div></div><span class="stop-duration">${s[0]}</span></div>`).join('');timeline.querySelectorAll('.stop').forEach(e=>{e.onclick=()=>selectStop(day,+e.dataset.stop);e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();selectStop(day,+e.dataset.stop)}}});selectStop(day,0)}
 function renderOverview(){overview=true;document.querySelectorAll('.day-tab').forEach(b=>{let yes=b.dataset.day==='overview';b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});$('dayTitle').textContent='三日行程总览';$('daySummary').textContent='12 个示意地点 · 三条独立日路线';$('routeStops').textContent='3 天 · 12 个停留点';$('routeDist').textContent='位置示意，不作导航';timeline.hidden=true;$('overviewDays').hidden=false;$('overviewDays').innerHTML=days.map((d,i)=>`<button class="overview-day" data-overview-day="${i}" style="--day-color:${colors[i]}"><b>DAY 0${i+1} · ${d.title}</b><small>4 个停留点 · ${d.dist}（示例估算）</small></button>`).join('');$('overviewDays').querySelectorAll('button').forEach(e=>e.onclick=()=>renderDay(+e.dataset.overviewDay));document.querySelectorAll('.route-path,.marker,.place-label').forEach(e=>e.style.display='');$('legend').classList.add('overview');$('legend').innerHTML=days.map((d,i)=>`<span class="day-key-${i}"><i></i>DAY 0${i+1}</span>`).join('')+'<span><i class="line-key"></i>示意路线</span>';$('spotCard').hidden=true;$('expandBtn').hidden=true;document.querySelector('.itinerary').classList.add('overview-active');fitRoute(layouts.flat())}
 document.querySelectorAll('.day-tab').forEach(b=>b.addEventListener('click',()=>b.dataset.day==='overview'?renderOverview():renderDay(+b.dataset.day)));makeMap();
$('collapseBtn').addEventListener('click',()=>{$('spotCard').hidden=true;$('expandBtn').hidden=false});$('expandBtn').addEventListener('click',()=>{$('spotCard').hidden=false;$('expandBtn').hidden=true});
function setZoom(value){zoom=Math.max(.8,Math.min(1.5,value));$('mapSvg').style.transform=`scale(${zoom})`;$('mapSvg').style.transformOrigin='50% 50%';$('zoomLabel').textContent=`${Math.round(zoom*100)}%`}$('zoomIn').addEventListener('click',()=>setZoom(zoom+.1));$('zoomOut').addEventListener('click',()=>setZoom(zoom-.1));$('resetMap').addEventListener('click',()=>{setZoom(1);toast('地图已复位')});$('layerToggle').addEventListener('click',()=>{layered=!layered;$('mapSvg').style.filter=layered?'saturate(.68) contrast(.95)':'none';toast(layered?'已切换柔和图层':'已恢复标准图层')});$('saveBtn').addEventListener('click',e=>{e.currentTarget.textContent=e.currentTarget.textContent.includes('收藏')?'♥　已收藏':'♡　收藏行程';toast('已为你记下这段旅程')});$('shareBtn').addEventListener('click',()=>toast('分享预览：杭州，慢慢走 · 三日行程'));$('spotAction').addEventListener('click',()=>toast('示例景点卡片 · 出行前请核对开放信息'));$('tipsBtn').addEventListener('click',()=>toast('行前记得确认开放时间、预约规则与当日交通安排'));
window.addEventListener('resize',()=>fitRoute(overview?layouts.flat():layouts[activeDay]));renderOverview();
})();
</script></body></html>
